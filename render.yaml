services:
  # Spring Boot Backend API
  - type: web
    name: argus-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Database (use an external MySQL provider like PlanetScale, Railway, or Aiven)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Redis
      - key: REDIS_HOST
        fromService:
          name: argus-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: argus-redis
          type: redis
          property: port
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # Mail (Gmail SMTP)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      # Twilio (optional)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_ENABLED
        value: "false"
      # CORS — set to your Render frontend URL
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Frontend Static Site
  - type: web
    name: argus-frontend
    runtime: static
    buildCommand: cd Argus_Frontend && npm install && npm run build
    staticPublishPath: Argus_Frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  # Redis Instance
  - type: redis
    name: argus-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
