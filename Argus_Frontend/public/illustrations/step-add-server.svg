<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="sa-glow"><feGaussianBlur stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <linearGradient id="sa-btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sa-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- Step number -->
  <text x="200" y="50" text-anchor="middle" fill="#22c55e" opacity="0.08" font-size="80" font-family="system-ui" font-weight="900">02</text>

  <!-- Server rack base -->
  <g filter="url(#sa-glow)">
    <rect x="60" y="70" width="280" height="240" rx="14" fill="#1a1744" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Header -->
  <text x="200" y="100" text-anchor="middle" fill="#e0e7ff" font-size="14" font-family="system-ui" font-weight="700">Add Your Server</text>

  <!-- Server entry form -->
  <rect x="86" y="116" width="228" height="28" rx="6" fill="#0f0a2e" stroke="#312e81" stroke-width="0.8"/>
  <text x="100" y="134" fill="#6366f1" font-size="9" font-family="system-ui" opacity="0.5">Server name</text>
  <text x="220" y="134" fill="#a5b4fc" font-size="9" font-family="monospace">prod-web-01</text>

  <rect x="86" y="152" width="228" height="28" rx="6" fill="#0f0a2e" stroke="#312e81" stroke-width="0.8"/>
  <text x="100" y="170" fill="#6366f1" font-size="9" font-family="system-ui" opacity="0.5">IP Address</text>
  <text x="220" y="170" fill="#a5b4fc" font-size="9" font-family="monospace">192.168.1.100</text>

  <rect x="86" y="188" width="228" height="28" rx="6" fill="#0f0a2e" stroke="#312e81" stroke-width="0.8"/>
  <text x="100" y="206" fill="#6366f1" font-size="9" font-family="system-ui" opacity="0.5">OS Type</text>
  <text x="220" y="206" fill="#a5b4fc" font-size="9" font-family="system-ui">Linux Ubuntu 22.04</text>

  <!-- Server visual -->
  <g transform="translate(130, 228)">
    <!-- Server unit 1 -->
    <rect x="0" y="0" width="140" height="24" rx="4" fill="#312e81" opacity="0.4" stroke="#22c55e" stroke-width="0.5"/>
    <circle cx="14" cy="12" r="3" fill="#22c55e" opacity="0.8"/>
    <rect x="24" y="7" width="40" height="3" rx="1" fill="#22c55e" opacity="0.2"/>
    <rect x="24" y="13" width="30" height="3" rx="1" fill="#22c55e" opacity="0.15"/>
    <text x="130" y="15" text-anchor="end" fill="#22c55e" font-size="7" font-family="monospace">ONLINE</text>
    <!-- Server unit 2 -->
    <rect x="0" y="30" width="140" height="24" rx="4" fill="#312e81" opacity="0.3" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <circle cx="14" cy="42" r="3" fill="#818cf8" opacity="0.3"/>
    <text x="70" y="46" text-anchor="middle" fill="#818cf8" font-size="8" font-family="system-ui" opacity="0.4">+ Add another...</text>
  </g>

  <!-- Add Server Button -->
  <rect x="120" y="295" width="160" height="30" rx="6" fill="url(#sa-btn)"/>
  <text x="200" y="314" text-anchor="middle" fill="white" font-size="11" font-family="system-ui" font-weight="600">+ Add Server</text>

  <!-- Bottom -->
  <text x="200" y="370" text-anchor="middle" fill="#a5b4fc" font-size="9" font-family="system-ui" opacity="0.4">Step 2 of 6</text>

  <!-- Decorative -->
  <circle cx="44" cy="350" r="2" fill="#22c55e" opacity="0.15"/>
  <circle cx="356" cy="60" r="2" fill="#22c55e" opacity="0.15"/>
</svg>