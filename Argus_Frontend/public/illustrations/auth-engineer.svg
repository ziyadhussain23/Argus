<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none">
  <defs>
    <linearGradient id="ae-bg" x1="0" y1="0" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="ae-glow"><feGaussianBlur stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <linearGradient id="ae-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338ca"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="520" height="520" fill="url(#ae-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="130" x2="520" y2="130"/><line x1="0" y1="260" x2="520" y2="260"/><line x1="0" y1="390" x2="520" y2="390"/>
    <line x1="130" y1="0" x2="130" y2="520"/><line x1="260" y1="0" x2="260" y2="520"/><line x1="390" y1="0" x2="390" y2="520"/>
  </g>

  <!-- Engineer character - sitting at desk -->
  <!-- Desk -->
  <rect x="120" y="330" width="280" height="8" rx="3" fill="#312e81" stroke="#818cf8" stroke-width="0.5"/>
  <!-- Desk legs -->
  <rect x="140" y="338" width="6" height="50" rx="2" fill="#312e81"/><rect x="374" y="338" width="6" height="50" rx="2" fill="#312e81"/>

  <!-- Monitor -->
  <g filter="url(#ae-glow)">
    <rect x="175" y="190" width="170" height="120" rx="8" fill="#0f0a2e" stroke="#818cf8" stroke-width="1.2"/>
  </g>
  <!-- Monitor stand -->
  <rect x="245" y="310" width="30" height="20" rx="2" fill="#312e81"/>
  <rect x="225" y="326" width="70" height="4" rx="2" fill="#312e81"/>
  <!-- Screen content -->
  <rect x="183" y="198" width="154" height="104" rx="4" fill="#1a1744"/>
  <!-- Mini dashboard on screen -->
  <rect x="189" y="204" width="70" height="16" rx="2" fill="#22c55e" opacity="0.1"/><text x="224" y="215" text-anchor="middle" fill="#22c55e" font-size="6" font-family="system-ui">CPU: 42%</text>
  <rect x="263" y="204" width="70" height="16" rx="2" fill="#818cf8" opacity="0.1"/><text x="298" y="215" text-anchor="middle" fill="#818cf8" font-size="6" font-family="system-ui">MEM: 67%</text>
  <!-- Chart -->
  <polyline points="192,270 206,264 220,256 234,260 248,250 262,246 276,252 290,240 304,236 318,234 330,238" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
  <path d="M192,270 L206,264 L220,256 L234,260 L248,250 L262,246 L276,252 L290,240 L304,236 L318,234 L330,238 L330,290 L192,290Z" fill="#22c55e" opacity="0.04"/>
  <!-- Server list on screen -->
  <circle cx="198" y="228" r="2" fill="#22c55e"/><rect x="204" y="226" width="40" height="4" rx="1" fill="#a5b4fc" opacity="0.2"/>
  <circle cx="198" y="238" r="2" fill="#f59e0b"/><rect x="204" y="236" width="34" height="4" rx="1" fill="#a5b4fc" opacity="0.15"/>
  <circle cx="198" y="248" r="2" fill="#22c55e"/><rect x="204" y="246" width="44" height="4" rx="1" fill="#a5b4fc" opacity="0.2"/>

  <!-- Keyboard -->
  <rect x="195" y="340" width="130" height="24" rx="4" fill="#1a1744" stroke="#312e81" stroke-width="0.5"/>
  <g fill="#312e81" opacity="0.4">
    <rect x="202" y="344" width="8" height="6" rx="1"/><rect x="212" y="344" width="8" height="6" rx="1"/><rect x="222" y="344" width="8" height="6" rx="1"/>
    <rect x="232" y="344" width="8" height="6" rx="1"/><rect x="242" y="344" width="8" height="6" rx="1"/><rect x="252" y="344" width="8" height="6" rx="1"/>
    <rect x="262" y="344" width="8" height="6" rx="1"/><rect x="272" y="344" width="8" height="6" rx="1"/><rect x="282" y="344" width="8" height="6" rx="1"/>
    <rect x="292" y="344" width="8" height="6" rx="1"/><rect x="302" y="344" width="8" height="6" rx="1"/><rect x="312" y="344" width="8" height="6" rx="1"/>
    <rect x="207" y="353" width="8" height="6" rx="1"/><rect x="217" y="353" width="8" height="6" rx="1"/>
    <rect x="227" y="353" width="60" height="6" rx="1"/>
    <rect x="289" y="353" width="8" height="6" rx="1"/><rect x="299" y="353" width="8" height="6" rx="1"/>
  </g>

  <!-- Mouse -->
  <rect x="340" y="340" width="18" height="26" rx="6" fill="#1a1744" stroke="#312e81" stroke-width="0.5"/>

  <!-- Chair -->
  <rect x="226" y="370" width="68" height="40" rx="8" fill="#312e81" opacity="0.6"/>
  <rect x="238" y="410" width="44" height="30" rx="4" fill="#312e81" opacity="0.4"/>

  <!-- Person (simplified) -->
  <!-- Head -->
  <circle cx="260" cy="160" r="22" fill="#312e81" stroke="#818cf8" stroke-width="0.8"/>
  <!-- Face features -->
  <circle cx="252" cy="156" r="2" fill="#818cf8" opacity="0.5"/><circle cx="268" cy="156" r="2" fill="#818cf8" opacity="0.5"/>
  <path d="M254,166 Q260,170 266,166" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <!-- Glasses -->
  <circle cx="252" cy="156" r="5" fill="none" stroke="#a5b4fc" stroke-width="0.5" opacity="0.4"/>
  <circle cx="268" cy="156" r="5" fill="none" stroke="#a5b4fc" stroke-width="0.5" opacity="0.4"/>
  <line x1="257" y1="156" x2="263" y2="156" stroke="#a5b4fc" stroke-width="0.5" opacity="0.4"/>

  <!-- Floating tech icons -->
  <!-- Spring Boot -->
  <g filter="url(#ae-glow)">
    <circle cx="80" cy="120" r="24" fill="#1a1744" stroke="#22c55e" stroke-width="0.8"/>
  </g>
  <text x="80" y="118" text-anchor="middle" fill="#22c55e" font-size="8" font-family="system-ui" font-weight="600">Spring</text>
  <text x="80" y="130" text-anchor="middle" fill="#22c55e" font-size="7" font-family="system-ui" opacity="0.6">Boot</text>

  <!-- React -->
  <g filter="url(#ae-glow)">
    <circle cx="440" cy="120" r="24" fill="#1a1744" stroke="#06b6d4" stroke-width="0.8"/>
  </g>
  <text x="440" y="118" text-anchor="middle" fill="#06b6d4" font-size="8" font-family="system-ui" font-weight="600">React</text>
  <text x="440" y="130" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="system-ui" opacity="0.6">+ TS</text>

  <!-- Docker -->
  <g filter="url(#ae-glow)">
    <circle cx="70" cy="260" r="20" fill="#1a1744" stroke="#818cf8" stroke-width="0.8"/>
  </g>
  <text x="70" y="264" text-anchor="middle" fill="#818cf8" font-size="8" font-family="system-ui" font-weight="600">API</text>

  <!-- WebSocket -->
  <g filter="url(#ae-glow)">
    <circle cx="450" cy="260" r="20" fill="#1a1744" stroke="#a78bfa" stroke-width="0.8"/>
  </g>
  <text x="450" y="264" text-anchor="middle" fill="#a78bfa" font-size="7" font-family="system-ui" font-weight="600">WS</text>

  <!-- Connecting lines -->
  <line x1="104" y1="120" x2="175" y2="240" stroke="#22c55e" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="416" y1="120" x2="345" y2="240" stroke="#06b6d4" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,4"/>

  <!-- Coffee cup -->
  <rect x="155" y="338" width="14" height="16" rx="2" fill="#1a1744" stroke="#f59e0b" stroke-width="0.5"/>
  <path d="M169,342 C175,342 175,350 169,350" fill="none" stroke="#f59e0b" stroke-width="0.5"/>
  <!-- Steam -->
  <path d="M160,336 Q162,330 160,324" fill="none" stroke="#a5b4fc" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Title at bottom -->
  <text x="260" y="480" text-anchor="middle" fill="#c7d2fe" font-size="12" font-family="system-ui" font-weight="600">Welcome to Argus</text>
  <text x="260" y="498" text-anchor="middle" fill="#a5b4fc" font-size="9" font-family="system-ui" opacity="0.5">Server Monitoring Made Simple</text>
</svg>