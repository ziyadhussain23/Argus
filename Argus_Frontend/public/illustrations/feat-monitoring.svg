<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" fill="none">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="520" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="fm-glow"><feGaussianBlur stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <rect width="520" height="390" fill="url(#fm-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="97" x2="520" y2="97"/><line x1="0" y1="195" x2="520" y2="195"/><line x1="0" y1="292" x2="520" y2="292"/>
    <line x1="130" y1="0" x2="130" y2="390"/><line x1="260" y1="0" x2="260" y2="390"/><line x1="390" y1="0" x2="390" y2="390"/>
  </g>

  <!-- Title -->
  <text x="260" y="36" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="system-ui" font-weight="600" letter-spacing="2">REAL-TIME MONITORING</text>

  <!-- Left: Server rack -->
  <g filter="url(#fm-glow)">
    <rect x="30" y="60" width="140" height="280" rx="10" fill="#1a1744" stroke="#22c55e" stroke-width="1"/>
  </g>
  <text x="100" y="84" text-anchor="middle" fill="#22c55e" font-size="10" font-family="system-ui" font-weight="600">Server Fleet</text>

  <!-- Server units -->
  <g>
    <rect x="44" y="96" width="112" height="28" rx="4" fill="#0f0a2e" stroke="#22c55e" stroke-width="0.5" opacity="0.5"/>
    <circle cx="56" cy="110" r="3" fill="#22c55e"/>
    <text x="66" y="113" fill="#a5b4fc" font-size="7" font-family="monospace">prod-web-01</text>
    <text x="148" y="113" text-anchor="end" fill="#22c55e" font-size="7" font-family="monospace">42%</text>

    <rect x="44" y="130" width="112" height="28" rx="4" fill="#0f0a2e" stroke="#22c55e" stroke-width="0.5" opacity="0.5"/>
    <circle cx="56" cy="144" r="3" fill="#22c55e"/>
    <text x="66" y="147" fill="#a5b4fc" font-size="7" font-family="monospace">prod-web-02</text>
    <text x="148" y="147" text-anchor="end" fill="#22c55e" font-size="7" font-family="monospace">38%</text>

    <rect x="44" y="164" width="112" height="28" rx="4" fill="#0f0a2e" stroke="#f59e0b" stroke-width="0.5" opacity="0.5"/>
    <circle cx="56" cy="178" r="3" fill="#f59e0b"/>
    <text x="66" y="181" fill="#a5b4fc" font-size="7" font-family="monospace">prod-db-01</text>
    <text x="148" y="181" text-anchor="end" fill="#f59e0b" font-size="7" font-family="monospace">78%</text>

    <rect x="44" y="198" width="112" height="28" rx="4" fill="#0f0a2e" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
    <circle cx="56" cy="212" r="3" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="215" fill="#a5b4fc" font-size="7" font-family="monospace">prod-api-01</text>
    <text x="148" y="215" text-anchor="end" fill="#ef4444" font-size="7" font-family="monospace">96%</text>

    <rect x="44" y="232" width="112" height="28" rx="4" fill="#0f0a2e" stroke="#22c55e" stroke-width="0.5" opacity="0.5"/>
    <circle cx="56" cy="246" r="3" fill="#22c55e"/>
    <text x="66" y="249" fill="#a5b4fc" font-size="7" font-family="monospace">staging-01</text>
    <text x="148" y="249" text-anchor="end" fill="#22c55e" font-size="7" font-family="monospace">23%</text>

    <rect x="44" y="266" width="112" height="28" rx="4" fill="#0f0a2e" stroke="#22c55e" stroke-width="0.5" opacity="0.4"/>
    <circle cx="56" cy="280" r="3" fill="#22c55e"/>
    <text x="66" y="283" fill="#a5b4fc" font-size="7" font-family="monospace">dev-worker</text>
    <text x="148" y="283" text-anchor="end" fill="#22c55e" font-size="7" font-family="monospace">15%</text>
  </g>

  <!-- Status summary -->
  <text x="100" y="316" text-anchor="middle" fill="#22c55e" font-size="8" font-family="system-ui">5 Online</text>
  <text x="100" y="330" text-anchor="middle" fill="#ef4444" font-size="8" font-family="system-ui">1 Critical</text>

  <!-- Right: Live dashboard -->
  <g filter="url(#fm-glow)">
    <rect x="200" y="50" width="290" height="300" rx="10" fill="#1a1744" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Dashboard title bar -->
  <rect x="200" y="50" width="290" height="24" rx="10" fill="#0f0a2e"/>
  <rect x="200" y="62" width="290" height="12" fill="#0f0a2e"/>
  <circle cx="216" cy="62" r="3" fill="#ef4444" opacity="0.6"/><circle cx="228" cy="62" r="3" fill="#f59e0b" opacity="0.6"/><circle cx="240" cy="62" r="3" fill="#22c55e" opacity="0.6"/>
  <text x="345" y="66" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.4">Argus Dashboard — Live</text>

  <!-- Metric mini cards -->
  <rect x="216" y="82" width="60" height="36" rx="4" fill="#312e81" opacity="0.3"/><text x="246" y="98" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">CPU Avg</text><text x="246" y="112" text-anchor="middle" fill="#22c55e" font-size="12" font-family="system-ui" font-weight="700">48%</text>
  <rect x="282" y="82" width="60" height="36" rx="4" fill="#312e81" opacity="0.3"/><text x="312" y="98" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">Mem Avg</text><text x="312" y="112" text-anchor="middle" fill="#818cf8" font-size="12" font-family="system-ui" font-weight="700">62%</text>
  <rect x="348" y="82" width="60" height="36" rx="4" fill="#312e81" opacity="0.3"/><text x="378" y="98" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">Alerts</text><text x="378" y="112" text-anchor="middle" fill="#ef4444" font-size="12" font-family="system-ui" font-weight="700">3</text>
  <rect x="414" y="82" width="60" height="36" rx="4" fill="#312e81" opacity="0.3"/><text x="444" y="98" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">Uptime</text><text x="444" y="112" text-anchor="middle" fill="#22c55e" font-size="12" font-family="system-ui" font-weight="700">99.9</text>

  <!-- CPU chart -->
  <rect x="216" y="126" width="258" height="90" rx="4" fill="#0f0a2e" opacity="0.5"/>
  <text x="228" y="140" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">CPU Usage — prod-api-01</text>
  <path d="M226,200 L246,195 L266,190 L286,185 L306,180 L326,175 L346,160 L366,148 L386,140 L406,142 L426,155 L446,160 L466,155" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <path d="M226,200 L246,195 L266,190 L286,185 L306,180 L326,175 L346,160 L366,148 L386,140 L406,142 L426,155 L446,160 L466,155 L466,208 L226,208Z" fill="#ef4444" opacity="0.06"/>
  <!-- Threshold line -->
  <line x1="226" y1="152" x2="466" y2="152" stroke="#ef4444" stroke-width="0.5" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="466" y="150" fill="#ef4444" font-size="6" font-family="monospace" opacity="0.5">90%</text>

  <!-- Memory chart overlay -->
  <path d="M226,196 L246,198 L266,194 L286,192 L306,190 L326,188 L346,186 L366,184 L386,182 L406,180 L426,178 L446,176 L466,174" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>

  <!-- Live pulse -->
  <circle cx="466" cy="155" r="3" fill="#ef4444" stroke="#1a1744" stroke-width="1.5"/>

  <!-- Network chart -->
  <rect x="216" y="224" width="126" height="66" rx="4" fill="#0f0a2e" opacity="0.5"/>
  <text x="228" y="238" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Network I/O</text>
  <polyline points="226,272 240,266 254,268 268,260 282,258 296,264 310,256 324,260 334,254" fill="none" stroke="#06b6d4" stroke-width="1"/>
  <polyline points="226,276 240,278 254,274 268,275 282,270 296,272 310,268 324,270 334,265" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>

  <!-- Disk chart -->
  <rect x="348" y="224" width="126" height="66" rx="4" fill="#0f0a2e" opacity="0.5"/>
  <text x="360" y="238" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Disk Usage</text>
  <!-- Stacked bars -->
  <rect x="364" y="262" width="12" height="22" rx="1" fill="#22c55e" opacity="0.4"/><rect x="380" y="256" width="12" height="28" rx="1" fill="#22c55e" opacity="0.4"/>
  <rect x="396" y="250" width="12" height="34" rx="1" fill="#f59e0b" opacity="0.4"/><rect x="412" y="258" width="12" height="26" rx="1" fill="#22c55e" opacity="0.4"/>
  <rect x="428" y="248" width="12" height="36" rx="1" fill="#f59e0b" opacity="0.4"/><rect x="444" y="254" width="12" height="30" rx="1" fill="#22c55e" opacity="0.4"/>
  <rect x="460" y="260" width="12" height="24" rx="1" fill="#22c55e" opacity="0.4"/>

  <!-- Events log -->
  <rect x="216" y="298" width="258" height="40" rx="4" fill="#0f0a2e" opacity="0.4"/>
  <text x="228" y="312" fill="#a5b4fc" font-size="6" font-family="monospace">[14:23:01] CPU threshold exceeded on prod-api-01</text>
  <text x="228" y="324" fill="#a5b4fc" font-size="6" font-family="monospace" opacity="0.5">[14:22:45] Memory usage normal on prod-web-01</text>
  <text x="228" y="336" fill="#a5b4fc" font-size="6" font-family="monospace" opacity="0.3">[14:22:30] Agent heartbeat received from staging</text>

  <!-- Connection lines from servers to dashboard -->
  <line x1="170" y1="110" x2="200" y2="100" stroke="#22c55e" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="170" y1="178" x2="200" y2="178" stroke="#f59e0b" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="170" y1="212" x2="200" y2="212" stroke="#ef4444" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3"/>
</svg>