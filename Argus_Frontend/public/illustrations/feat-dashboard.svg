<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" fill="none">
  <defs>
    <linearGradient id="fd-bg" x1="0" y1="0" x2="520" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="fd-glow"><feGaussianBlur stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <rect width="520" height="390" fill="url(#fd-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="97" x2="520" y2="97"/><line x1="0" y1="195" x2="520" y2="195"/><line x1="0" y1="292" x2="520" y2="292"/>
    <line x1="130" y1="0" x2="130" y2="390"/><line x1="260" y1="0" x2="260" y2="390"/><line x1="390" y1="0" x2="390" y2="390"/>
  </g>

  <!-- Title -->
  <text x="260" y="36" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="system-ui" font-weight="600" letter-spacing="2">POWERFUL DASHBOARD</text>

  <!-- Browser frame -->
  <g filter="url(#fd-glow)">
    <rect x="30" y="50" width="460" height="310" rx="12" fill="#0f0a2e" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Title bar -->
  <rect x="30" y="50" width="460" height="24" rx="12" fill="#1a1744"/>
  <rect x="30" y="62" width="460" height="12" fill="#1a1744"/>
  <circle cx="48" cy="62" r="3.5" fill="#ef4444" opacity="0.6"/><circle cx="60" cy="62" r="3.5" fill="#f59e0b" opacity="0.6"/><circle cx="72" cy="62" r="3.5" fill="#22c55e" opacity="0.6"/>
  <rect x="140" y="56" width="240" height="13" rx="3" fill="#0f0a2e" opacity="0.5"/>
  <text x="260" y="66" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="monospace" opacity="0.4">argus.example.com/dashboard</text>

  <!-- Sidebar -->
  <rect x="30" y="74" width="70" height="286" fill="#1a1744"/>
  <!-- Nav items -->
  <rect x="36" y="82" width="58" height="20" rx="4" fill="#4338ca" opacity="0.3"/>
  <text x="65" y="96" text-anchor="middle" fill="#818cf8" font-size="7" font-family="system-ui">Dashboard</text>
  <text x="65" y="116" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.4">Servers</text>
  <text x="65" y="132" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.4">Alerts</text>
  <text x="65" y="148" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.4">Reports</text>
  <text x="65" y="164" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.4">Settings</text>

  <!-- Main content area -->
  <!-- Header -->
  <text x="114" y="92" fill="#e0e7ff" font-size="11" font-family="system-ui" font-weight="700">Dashboard Overview</text>
  <text x="440" y="92" text-anchor="end" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Last updated: 2s ago</text>

  <!-- 4 metric cards -->
  <rect x="108" y="100" width="88" height="44" rx="6" fill="#312e81" opacity="0.3" stroke="#22c55e" stroke-width="0.5"/>
  <text x="152" y="116" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">Total Servers</text>
  <text x="152" y="134" text-anchor="middle" fill="#22c55e" font-size="16" font-family="system-ui" font-weight="700">12</text>

  <rect x="202" y="100" width="88" height="44" rx="6" fill="#312e81" opacity="0.3" stroke="#818cf8" stroke-width="0.5"/>
  <text x="246" y="116" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">CPU Average</text>
  <text x="246" y="134" text-anchor="middle" fill="#818cf8" font-size="16" font-family="system-ui" font-weight="700">48%</text>

  <rect x="296" y="100" width="88" height="44" rx="6" fill="#312e81" opacity="0.3" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="340" y="116" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">Active Alerts</text>
  <text x="340" y="134" text-anchor="middle" fill="#f59e0b" font-size="16" font-family="system-ui" font-weight="700">3</text>

  <rect x="390" y="100" width="88" height="44" rx="6" fill="#312e81" opacity="0.3" stroke="#22c55e" stroke-width="0.5"/>
  <text x="434" y="116" text-anchor="middle" fill="#a5b4fc" font-size="6" font-family="system-ui">Avg Uptime</text>
  <text x="434" y="134" text-anchor="middle" fill="#22c55e" font-size="16" font-family="system-ui" font-weight="700">99.9%</text>

  <!-- CPU Chart -->
  <rect x="108" y="152" width="240" height="100" rx="6" fill="#1a1744" opacity="0.6"/>
  <text x="120" y="168" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">CPU Usage — All Servers (24h)</text>
  <!-- Area chart -->
  <path d="M120,236 L140,230 L160,224 L180,228 L200,218 L220,210 L240,216 L260,206 L280,198 L300,200 L320,194 L336,196" fill="none" stroke="#22c55e" stroke-width="1.2"/>
  <path d="M120,236 L140,230 L160,224 L180,228 L200,218 L220,210 L240,216 L260,206 L280,198 L300,200 L320,194 L336,196 L336,242 L120,242Z" fill="#22c55e" opacity="0.05"/>
  <!-- 2nd line -->
  <path d="M120,232 L140,226 L160,222 L180,220 L200,216 L220,218 L240,212 L260,208 L280,210 L300,204 L320,206 L336,202" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Server table / right widget -->
  <rect x="354" y="152" width="124" height="100" rx="6" fill="#1a1744" opacity="0.6"/>
  <text x="366" y="168" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Server Status</text>
  <!-- rows -->
  <g font-size="6" font-family="system-ui">
    <circle cx="366" cy="182" r="2.5" fill="#22c55e"/><text x="374" y="184" fill="#a5b4fc">prod-web-01</text><text x="470" y="184" text-anchor="end" fill="#22c55e">Online</text>
    <circle cx="366" cy="196" r="2.5" fill="#22c55e"/><text x="374" y="198" fill="#a5b4fc">prod-web-02</text><text x="470" y="198" text-anchor="end" fill="#22c55e">Online</text>
    <circle cx="366" cy="210" r="2.5" fill="#ef4444"/><text x="374" y="212" fill="#a5b4fc">prod-api-01</text><text x="470" y="212" text-anchor="end" fill="#ef4444">Critical</text>
    <circle cx="366" cy="224" r="2.5" fill="#f59e0b"/><text x="374" y="226" fill="#a5b4fc">prod-db-01</text><text x="470" y="226" text-anchor="end" fill="#f59e0b">Warning</text>
    <circle cx="366" cy="238" r="2.5" fill="#22c55e"/><text x="374" y="240" fill="#a5b4fc">staging-01</text><text x="470" y="240" text-anchor="end" fill="#22c55e">Online</text>
  </g>

  <!-- Bottom row: alerts + report -->
  <rect x="108" y="260" width="190" height="90" rx="6" fill="#1a1744" opacity="0.6"/>
  <text x="120" y="276" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Recent Alerts</text>
  <rect x="116" y="284" width="174" height="18" rx="3" fill="#ef4444" opacity="0.04"/>
  <circle cx="124" cy="293" r="2" fill="#ef4444"/><text x="132" y="296" fill="#fca5a5" font-size="6" font-family="system-ui">CPU 96% — prod-api-01 — 2m ago</text>
  <rect x="116" y="306" width="174" height="18" rx="3" fill="#f59e0b" opacity="0.04"/>
  <circle cx="124" cy="315" r="2" fill="#f59e0b"/><text x="132" y="318" fill="#fcd34d" font-size="6" font-family="system-ui">Disk 85% — prod-db-01 — 15m ago</text>
  <rect x="116" y="328" width="174" height="18" rx="3" fill="#22c55e" opacity="0.04"/>
  <circle cx="124" cy="337" r="2" fill="#22c55e" opacity="0.5"/><text x="132" y="340" fill="#86efac" font-size="6" font-family="system-ui">Resolved — Memory spike — 1h ago</text>

  <!-- Report widget -->
  <rect x="304" y="260" width="174" height="90" rx="6" fill="#1a1744" opacity="0.6"/>
  <text x="316" y="276" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Quick Actions</text>
  <rect x="312" y="284" width="74" height="22" rx="4" fill="#4338ca" opacity="0.2"/>
  <text x="349" y="299" text-anchor="middle" fill="#818cf8" font-size="7" font-family="system-ui">📊 Export</text>
  <rect x="392" y="284" width="78" height="22" rx="4" fill="#22c55e" opacity="0.1"/>
  <text x="431" y="299" text-anchor="middle" fill="#22c55e" font-size="7" font-family="system-ui">+ Add Server</text>
  <rect x="312" y="314" width="74" height="22" rx="4" fill="#f59e0b" opacity="0.1"/>
  <text x="349" y="329" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="system-ui">⚙ Settings</text>
  <rect x="392" y="314" width="78" height="22" rx="4" fill="#a78bfa" opacity="0.1"/>
  <text x="431" y="329" text-anchor="middle" fill="#a78bfa" font-size="7" font-family="system-ui">📋 Reports</text>
</svg>