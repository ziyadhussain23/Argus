<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="sm-glow"><feGaussianBlur stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#sm-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- Step number -->
  <text x="200" y="50" text-anchor="middle" fill="#06b6d4" opacity="0.08" font-size="80" font-family="system-ui" font-weight="900">04</text>

  <!-- Dashboard frame -->
  <g filter="url(#sm-glow)">
    <rect x="40" y="60" width="320" height="270" rx="12" fill="#1a1744" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <text x="200" y="86" text-anchor="middle" fill="#e0e7ff" font-size="13" font-family="system-ui" font-weight="700">Real-Time Metrics</text>

  <!-- Metric cards row -->
  <g>
    <!-- CPU -->
    <rect x="56" y="98" width="68" height="52" rx="6" fill="#312e81" opacity="0.3" stroke="#22c55e" stroke-width="0.5"/>
    <text x="90" y="114" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui">CPU</text>
    <text x="90" y="135" text-anchor="middle" fill="#22c55e" font-size="18" font-family="system-ui" font-weight="700">42%</text>
    <!-- Memory -->
    <rect x="132" y="98" width="68" height="52" rx="6" fill="#312e81" opacity="0.3" stroke="#818cf8" stroke-width="0.5"/>
    <text x="166" y="114" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui">MEMORY</text>
    <text x="166" y="135" text-anchor="middle" fill="#818cf8" font-size="18" font-family="system-ui" font-weight="700">67%</text>
    <!-- Disk -->
    <rect x="208" y="98" width="68" height="52" rx="6" fill="#312e81" opacity="0.3" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="242" y="114" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui">DISK</text>
    <text x="242" y="135" text-anchor="middle" fill="#f59e0b" font-size="18" font-family="system-ui" font-weight="700">78%</text>
    <!-- Uptime -->
    <rect x="284" y="98" width="68" height="52" rx="6" fill="#312e81" opacity="0.3" stroke="#a78bfa" stroke-width="0.5"/>
    <text x="318" y="114" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui">UPTIME</text>
    <text x="318" y="135" text-anchor="middle" fill="#a78bfa" font-size="18" font-family="system-ui" font-weight="700">99.9</text>
  </g>

  <!-- Chart area -->
  <rect x="56" y="162" width="296" height="100" rx="6" fill="#0f0a2e" opacity="0.5"/>
  <text x="72" y="178" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">CPU Usage — Last 24h</text>
  <!-- Y axis labels -->
  <text x="64" y="194" fill="#a5b4fc" font-size="6" font-family="monospace" opacity="0.3">80</text>
  <text x="64" y="218" fill="#a5b4fc" font-size="6" font-family="monospace" opacity="0.3">40</text>
  <text x="64" y="248" fill="#a5b4fc" font-size="6" font-family="monospace" opacity="0.3">0</text>
  <!-- Area chart -->
  <path d="M76,240 L96,235 L116,228 L136,230 L156,215 L176,210 L196,218 L216,205 L236,195 L256,200 L276,192 L296,188 L316,195 L336,190 L346,192" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M76,240 L96,235 L116,228 L136,230 L156,215 L176,210 L196,218 L216,205 L236,195 L256,200 L276,192 L296,188 L316,195 L336,190 L346,192 L346,252 L76,252Z" fill="#22c55e" opacity="0.06"/>
  <!-- Current value marker -->
  <circle cx="346" cy="192" r="3" fill="#22c55e" stroke="#1a1744" stroke-width="1.5"/>
  <!-- Tooltip -->
  <rect x="306" y="174" width="50" height="16" rx="3" fill="#22c55e" opacity="0.15"/>
  <text x="331" y="185" text-anchor="middle" fill="#22c55e" font-size="7" font-family="monospace">42% ↑</text>

  <!-- Memory chart line -->
  <path d="M76,225 L96,220 L116,215 L136,218 L156,210 L176,205 L196,210 L216,200 L236,198 L256,202 L276,195 L296,190 L316,192 L336,188 L346,186" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>

  <!-- Live indicator -->
  <circle cx="340" cy="268" r="3" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="330" y="271" text-anchor="end" fill="#22c55e" font-size="7" font-family="system-ui">LIVE</text>

  <!-- Server list mini -->
  <rect x="56" y="278" width="142" height="16" rx="3" fill="#312e81" opacity="0.2"/>
  <circle cx="66" cy="286" r="3" fill="#22c55e"/><text x="76" y="289" fill="#a5b4fc" font-size="7" font-family="system-ui">prod-web-01</text>

  <rect x="56" y="298" width="142" height="16" rx="3" fill="#312e81" opacity="0.15"/>
  <circle cx="66" cy="306" r="3" fill="#22c55e"/><text x="76" y="309" fill="#a5b4fc" font-size="7" font-family="system-ui">prod-db-01</text>

  <rect x="210" y="278" width="142" height="16" rx="3" fill="#312e81" opacity="0.2"/>
  <circle cx="220" cy="286" r="3" fill="#f59e0b"/><text x="230" y="289" fill="#a5b4fc" font-size="7" font-family="system-ui">staging-api</text>

  <rect x="210" y="298" width="142" height="16" rx="3" fill="#312e81" opacity="0.15"/>
  <circle cx="220" cy="306" r="3" fill="#22c55e"/><text x="230" y="309" fill="#a5b4fc" font-size="7" font-family="system-ui">dev-worker-01</text>

  <!-- Bottom label -->
  <text x="200" y="370" text-anchor="middle" fill="#a5b4fc" font-size="9" font-family="system-ui" opacity="0.4">Step 4 of 6</text>
</svg>