<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="sc-glow"><feGaussianBlur stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#sc-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- Step number -->
  <text x="200" y="50" text-anchor="middle" fill="#a78bfa" opacity="0.08" font-size="80" font-family="system-ui" font-weight="900">06</text>

  <!-- Central hub -->
  <g filter="url(#sc-glow)">
    <circle cx="200" cy="190" r="40" fill="#1a1744" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="200" y="185" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="system-ui" font-weight="700">ARGUS</text>
  <text x="200" y="200" text-anchor="middle" fill="#c7d2fe" font-size="7" font-family="system-ui">Central Hub</text>

  <!-- Pulse rings -->
  <circle cx="200" cy="190" r="55" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="55;75;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="190" r="65" fill="none" stroke="#818cf8" stroke-width="0.3" opacity="0.1">
    <animate attributeName="r" values="65;90;65" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Server nodes around hub -->
  <!-- Top-left: Web servers -->
  <g>
    <line x1="165" y1="160" x2="95" y2="100" stroke="#22c55e" stroke-width="0.8" opacity="0.4"/>
    <rect x="55" y="72" width="80" height="42" rx="6" fill="#1a1744" stroke="#22c55e" stroke-width="0.8"/>
    <text x="95" y="90" text-anchor="middle" fill="#22c55e" font-size="7" font-family="system-ui" font-weight="600">Web Cluster</text>
    <text x="95" y="104" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">4 servers</text>
    <circle cx="67" cy="87" r="2" fill="#22c55e"/><circle cx="75" cy="87" r="2" fill="#22c55e"/><circle cx="83" cy="87" r="2" fill="#22c55e"/><circle cx="75" cy="97" r="2" fill="#22c55e"/>
  </g>

  <!-- Top-right: API servers -->
  <g>
    <line x1="235" y1="160" x2="305" y2="100" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
    <rect x="265" y="72" width="80" height="42" rx="6" fill="#1a1744" stroke="#818cf8" stroke-width="0.8"/>
    <text x="305" y="90" text-anchor="middle" fill="#818cf8" font-size="7" font-family="system-ui" font-weight="600">API Cluster</text>
    <text x="305" y="104" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">3 servers</text>
    <circle cx="293" cy="87" r="2" fill="#818cf8"/><circle cx="301" cy="87" r="2" fill="#818cf8"/><circle cx="309" cy="87" r="2" fill="#818cf8"/>
  </g>

  <!-- Right: Database -->
  <g>
    <line x1="240" y1="190" x2="310" y2="190" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <rect x="310" y="168" width="70" height="42" rx="6" fill="#1a1744" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="345" y="186" text-anchor="middle" fill="#06b6d4" font-size="7" font-family="system-ui" font-weight="600">Databases</text>
    <text x="345" y="200" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">2 servers</text>
    <circle cx="337" cy="193" r="2" fill="#06b6d4"/><circle cx="345" cy="193" r="2" fill="#06b6d4"/>
  </g>

  <!-- Left: Workers -->
  <g>
    <line x1="160" y1="190" x2="90" y2="190" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
    <rect x="20" y="168" width="70" height="42" rx="6" fill="#1a1744" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="55" y="186" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="system-ui" font-weight="600">Workers</text>
    <text x="55" y="200" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">5 servers</text>
    <circle cx="37" cy="193" r="2" fill="#f59e0b"/><circle cx="45" cy="193" r="2" fill="#f59e0b"/><circle cx="53" cy="193" r="2" fill="#f59e0b"/>
    <circle cx="60" cy="193" r="2" fill="#f59e0b"/><circle cx="68" cy="193" r="2" fill="#f59e0b"/>
  </g>

  <!-- Bottom-left: Cache -->
  <g>
    <line x1="165" y1="220" x2="95" y2="280" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>
    <rect x="55" y="262" width="80" height="42" rx="6" fill="#1a1744" stroke="#ef4444" stroke-width="0.8"/>
    <text x="95" y="280" text-anchor="middle" fill="#ef4444" font-size="7" font-family="system-ui" font-weight="600">Cache Layer</text>
    <text x="95" y="294" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">2 servers</text>
    <circle cx="87" cy="287" r="2" fill="#ef4444"/><circle cx="95" cy="287" r="2" fill="#ef4444"/>
  </g>

  <!-- Bottom-right: CDN -->
  <g>
    <line x1="235" y1="220" x2="305" y2="280" stroke="#22c55e" stroke-width="0.8" opacity="0.4"/>
    <rect x="265" y="262" width="80" height="42" rx="6" fill="#1a1744" stroke="#22c55e" stroke-width="0.8"/>
    <text x="305" y="280" text-anchor="middle" fill="#22c55e" font-size="7" font-family="system-ui" font-weight="600">CDN / Edge</text>
    <text x="305" y="294" text-anchor="middle" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">6 servers</text>
    <circle cx="283" cy="287" r="2" fill="#22c55e"/><circle cx="291" cy="287" r="2" fill="#22c55e"/><circle cx="299" cy="287" r="2" fill="#22c55e"/>
    <circle cx="307" cy="287" r="2" fill="#22c55e"/><circle cx="315" cy="287" r="2" fill="#22c55e"/><circle cx="323" cy="287" r="2" fill="#22c55e"/>
  </g>

  <!-- Total server count -->
  <rect x="130" y="340" width="140" height="28" rx="6" fill="#a78bfa" opacity="0.08" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="200" y="358" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="system-ui" font-weight="600">22 Servers Monitored</text>

  <!-- Bottom label -->
  <text x="200" y="392" text-anchor="middle" fill="#a5b4fc" font-size="9" font-family="system-ui" opacity="0.4">Step 6 of 6</text>
</svg>