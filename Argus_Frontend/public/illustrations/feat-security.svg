<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" fill="none">
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="520" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <filter id="fs-glow"><feGaussianBlur stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <rect width="520" height="390" fill="url(#fs-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="97" x2="520" y2="97"/><line x1="0" y1="195" x2="520" y2="195"/><line x1="0" y1="292" x2="520" y2="292"/>
    <line x1="130" y1="0" x2="130" y2="390"/><line x1="260" y1="0" x2="260" y2="390"/><line x1="390" y1="0" x2="390" y2="390"/>
  </g>

  <!-- Title -->
  <text x="260" y="36" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="system-ui" font-weight="600" letter-spacing="2">ENTERPRISE SECURITY</text>

  <!-- Central shield -->
  <g filter="url(#fs-glow)" transform="translate(210, 45)">
    <circle cx="50" cy="55" r="48" fill="#1a1744" stroke="#22c55e" stroke-width="1.5"/>
    <!-- Shield shape -->
    <path d="M50,20 L72,32 L72,55 C72,72 50,85 50,85 C50,85 28,72 28,55 L28,32Z" fill="#22c55e" opacity="0.08" stroke="#22c55e" stroke-width="1.5"/>
    <!-- Checkmark -->
    <path d="M40,52 L47,60 L62,42" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pulse from shield -->
  <circle cx="260" cy="100" r="52" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="52;72;52" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Left column: Auth & Access -->
  <g filter="url(#fs-glow)">
    <rect x="30" y="155" width="220" height="210" rx="10" fill="#1a1744" stroke="#818cf8" stroke-width="1"/>
  </g>
  <text x="140" y="180" text-anchor="middle" fill="#818cf8" font-size="10" font-family="system-ui" font-weight="600">Authentication</text>

  <!-- JWT Token -->
  <rect x="44" y="192" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="58" y="207" fill="#22c55e" font-size="7" font-family="system-ui" font-weight="600">🔑 JWT Token Auth</text>
  <text x="58" y="220" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Secure stateless authentication</text>

  <!-- Password encryption -->
  <rect x="44" y="234" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="58" y="249" fill="#a78bfa" font-size="7" font-family="system-ui" font-weight="600">🔒 BCrypt Encryption</text>
  <text x="58" y="262" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Password hashing with salt rounds</text>

  <!-- Email verification -->
  <rect x="44" y="276" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="58" y="291" fill="#06b6d4" font-size="7" font-family="system-ui" font-weight="600">✉ Email Verification</text>
  <text x="58" y="304" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Verified accounts only access</text>

  <!-- CORS -->
  <rect x="44" y="318" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="58" y="333" fill="#f59e0b" font-size="7" font-family="system-ui" font-weight="600">🌐 CORS Protection</text>
  <text x="58" y="346" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Cross-origin request filtering</text>

  <!-- Right column: Data Security -->
  <g filter="url(#fs-glow)">
    <rect x="270" y="155" width="220" height="210" rx="10" fill="#1a1744" stroke="#22c55e" stroke-width="1"/>
  </g>
  <text x="380" y="180" text-anchor="middle" fill="#22c55e" font-size="10" font-family="system-ui" font-weight="600">Data Protection</text>

  <!-- HTTPS -->
  <rect x="284" y="192" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="298" y="207" fill="#22c55e" font-size="7" font-family="system-ui" font-weight="600">🔐 HTTPS/TLS</text>
  <text x="298" y="220" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">End-to-end encrypted transport</text>

  <!-- Rate limiting -->
  <rect x="284" y="234" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="298" y="249" fill="#ef4444" font-size="7" font-family="system-ui" font-weight="600">⏱ Rate Limiting</text>
  <text x="298" y="262" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">API abuse prevention</text>

  <!-- Token refresh -->
  <rect x="284" y="276" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="298" y="291" fill="#818cf8" font-size="7" font-family="system-ui" font-weight="600">🔄 Token Refresh</text>
  <text x="298" y="304" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Automatic session renewal</text>

  <!-- Input validation -->
  <rect x="284" y="318" width="192" height="36" rx="5" fill="#0f0a2e" opacity="0.6"/>
  <text x="298" y="333" fill="#f59e0b" font-size="7" font-family="system-ui" font-weight="600">✅ Input Validation</text>
  <text x="298" y="346" fill="#a5b4fc" font-size="7" font-family="system-ui" opacity="0.5">Spring Security + sanitization</text>

  <!-- Connection lines from shield to columns -->
  <path d="M230,120 C200,140 170,155 140,155" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
  <path d="M290,120 C320,140 350,155 380,155" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
</svg>