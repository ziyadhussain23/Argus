<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="hf-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <linearGradient id="hf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="hf-glow"><feGaussianBlur stdDeviation="12" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="hf-glow-sm"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <rect width="800" height="450" fill="url(#hf-bg)" rx="16"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/><line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/><line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <!-- Central Server -->
  <g filter="url(#hf-glow)">
    <circle cx="400" cy="225" r="60" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
    <circle cx="400" cy="225" r="52" fill="#1a1744" stroke="#312e81" stroke-width="1"/>
  </g>
  <!-- Server icon -->
  <rect x="380" y="205" width="40" height="10" rx="2" fill="#818cf8" opacity="0.8"/>
  <rect x="380" y="219" width="40" height="10" rx="2" fill="#818cf8" opacity="0.6"/>
  <rect x="380" y="233" width="40" height="10" rx="2" fill="#818cf8" opacity="0.4"/>
  <circle cx="414" cy="210" r="2" fill="#22c55e"/><circle cx="414" cy="224" r="2" fill="#22c55e"/><circle cx="414" cy="238" r="2" fill="#fbbf24"/>

  <!-- Orbiting Icons -->
  <!-- CPU Gauge (top-left) -->
  <g filter="url(#hf-glow-sm)">
    <circle cx="250" cy="110" r="36" fill="#1a1744" stroke="#4338ca" stroke-width="1.5"/>
    <path d="M235,110 A15,15 0 1,1 265,110" fill="none" stroke="#312e81" stroke-width="4" stroke-linecap="round"/>
    <path d="M235,110 A15,15 0 1,1 258,98" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="124" text-anchor="middle" fill="#818cf8" font-size="9" font-family="system-ui" font-weight="700">CPU</text>
  </g>
  <line x1="278" y1="138" x2="348" y2="190" stroke="#4338ca" stroke-width="1" opacity="0.4" stroke-dasharray="4 4"/>

  <!-- Alert Bell (top-right) -->
  <g filter="url(#hf-glow-sm)">
    <circle cx="550" cy="100" r="36" fill="#1a1744" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>
    <path d="M540,104 L540,96 A10,10 0 0,1 560,96 L560,104 L564,108 L536,108Z" fill="#ef4444" opacity="0.7"/>
    <circle cx="550" cy="112" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="562" cy="92" r="4" fill="#ef4444" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="524" y1="126" x2="452" y2="186" stroke="#ef4444" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Chart (bottom-right) -->
  <g filter="url(#hf-glow-sm)">
    <circle cx="570" cy="320" r="36" fill="#1a1744" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
    <polyline points="548,332 554,322 560,328 566,312 572,318 578,306 584,310 590,304" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="548" y="336" width="40" height="2" rx="1" fill="#22c55e" opacity="0.3"/>
  </g>
  <line x1="542" y1="298" x2="450" y2="260" stroke="#22c55e" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Shield (bottom-left) -->
  <g filter="url(#hf-glow-sm)">
    <circle cx="230" cy="330" r="36" fill="#1a1744" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
    <path d="M230,308 L248,316 L248,332 C248,342 230,352 230,352 C230,352 212,342 212,332 L212,316Z" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <path d="M222,330 L228,336 L238,322" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="258" y1="308" x2="350" y2="260" stroke="#fbbf24" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Network (left) -->
  <g filter="url(#hf-glow-sm)">
    <circle cx="150" cy="225" r="32" fill="#1a1744" stroke="#a78bfa" stroke-width="1.5" opacity="0.8"/>
    <circle cx="150" cy="218" r="4" fill="#a78bfa" opacity="0.7"/>
    <line x1="150" y1="222" x2="140" y2="234" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
    <line x1="150" y1="222" x2="160" y2="234" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
    <circle cx="140" cy="236" r="3" fill="#a78bfa" opacity="0.5"/>
    <circle cx="160" cy="236" r="3" fill="#a78bfa" opacity="0.5"/>
  </g>
  <line x1="182" y1="225" x2="340" y2="225" stroke="#a78bfa" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Logs (right) -->
  <g filter="url(#hf-glow-sm)">
    <circle cx="650" cy="210" r="32" fill="#1a1744" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
    <rect x="636" y="200" width="28" height="3" rx="1.5" fill="#06b6d4" opacity="0.7"/>
    <rect x="636" y="207" width="22" height="3" rx="1.5" fill="#06b6d4" opacity="0.5"/>
    <rect x="636" y="214" width="26" height="3" rx="1.5" fill="#06b6d4" opacity="0.4"/>
    <rect x="636" y="221" width="18" height="3" rx="1.5" fill="#06b6d4" opacity="0.3"/>
  </g>
  <line x1="618" y1="218" x2="460" y2="230" stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Orbital rings -->
  <ellipse cx="400" cy="225" rx="180" ry="140" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.15" stroke-dasharray="6 6"/>
  <ellipse cx="400" cy="225" rx="260" ry="180" fill="none" stroke="#312e81" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 8"/>

  <!-- Pulse rings from center -->
  <circle cx="400" cy="225" r="70" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="60;90;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="225" r="80" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.1">
    <animate attributeName="r" values="70;110;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>