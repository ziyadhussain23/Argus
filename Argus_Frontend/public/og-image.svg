<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d2e"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fff"/>
      <stop offset="70%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="dash-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- Corner accents -->
  <circle cx="0" cy="0" r="200" fill="#6366f1" opacity="0.06"/>
  <circle cx="1200" cy="630" r="200" fill="#8b5cf6" opacity="0.06"/>

  <!-- Logo icon -->
  <g transform="translate(80, 200)">
    <rect width="80" height="80" rx="18" fill="#312e81" stroke="#4338ca" stroke-width="2"/>
    <rect x="14" y="12" width="52" height="36" rx="6" fill="#0a0824" stroke="#4338ca" stroke-width="1" opacity="0.7"/>
    <polyline points="18,36 28,36 32,26 38,44 44,22 50,38 56,30 62,30" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="62" cy="30" r="3" fill="#34d399"/>
    <rect x="30" y="52" width="20" height="5" rx="2" fill="#312e81"/>
    <rect x="24" y="60" width="32" height="4" rx="2" fill="#312e81"/>
  </g>

  <!-- Title text -->
  <text x="180" y="240" fill="#fff" font-size="52" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-1">Monitor Server</text>

  <!-- Subtitle -->
  <text x="180" y="280" fill="#a5b4fc" font-size="22" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Real-Time Server Monitoring Dashboard</text>

  <!-- Decorative pulse line across middle -->
  <polyline
    points="80,380 200,380 260,340 340,420 420,310 500,400 560,355 640,370 720,370 800,370 860,330 940,410 1020,320 1080,370 1120,370"
    fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Feature pills -->
  <g transform="translate(80, 430)">
    <rect width="120" height="36" rx="18" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#34d399"/>
    <text x="34" y="23" fill="#c7d2fe" font-size="13" font-weight="500" font-family="system-ui">CPU</text>

    <rect x="136" width="130" height="36" rx="18" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
    <circle cx="156" cy="18" r="5" fill="#a78bfa"/>
    <text x="170" y="23" fill="#c7d2fe" font-size="13" font-weight="500" font-family="system-ui">Memory</text>

    <rect x="282" width="110" height="36" rx="18" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
    <circle cx="302" cy="18" r="5" fill="#fbbf24"/>
    <text x="316" y="23" fill="#c7d2fe" font-size="13" font-weight="500" font-family="system-ui">Disk</text>

    <rect x="408" width="130" height="36" rx="18" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
    <circle cx="428" cy="18" r="5" fill="#60a5fa"/>
    <text x="442" y="23" fill="#c7d2fe" font-size="13" font-weight="500" font-family="system-ui">Network</text>

    <rect x="554" width="120" height="36" rx="18" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
    <circle cx="574" cy="18" r="5" fill="#f87171"/>
    <text x="588" y="23" fill="#c7d2fe" font-size="13" font-weight="500" font-family="system-ui">Alerts</text>
  </g>

  <!-- Description line -->
  <text x="80" y="520" fill="#9ca3af" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Open-source, self-hosted infrastructure monitoring</text>
  <text x="80" y="542" fill="#9ca3af" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif">with real-time metrics and intelligent alerts.</text>

  <!-- Domain -->
  <text x="80" y="585" fill="#6366f1" font-size="18" font-weight="600" font-family="system-ui, -apple-system, sans-serif">monitorserver.in</text>

  <!-- Subtle glow behind dashboard mockup -->
  <ellipse cx="940" cy="270" rx="220" ry="160" fill="url(#dash-glow)"/>

  <!-- Right side: mini dashboard mockup -->
  <g transform="translate(750, 140)">
    <rect width="380" height="260" rx="16" fill="#0f0d2e" stroke="#312e81" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="380" height="36" rx="16" fill="#1e1b4b"/>
    <rect x="0" y="16" width="380" height="20" fill="#1e1b4b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="38" cy="18" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="56" cy="18" r="5" fill="#34d399" opacity="0.7"/>
    <text x="190" y="23" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="system-ui">Dashboard</text>

    <!-- Mini metric cards row -->
    <g transform="translate(12, 48)">
      <rect width="82" height="48" rx="8" fill="#1e1b4b"/>
      <text x="8" y="18" fill="#818cf8" font-size="9" font-family="system-ui">CPU</text>
      <text x="8" y="36" fill="#fff" font-size="16" font-weight="700" font-family="system-ui">24%</text>

      <rect x="92" width="82" height="48" rx="8" fill="#1e1b4b"/>
      <text x="100" y="18" fill="#a78bfa" font-size="9" font-family="system-ui">Memory</text>
      <text x="100" y="36" fill="#fff" font-size="16" font-weight="700" font-family="system-ui">61%</text>

      <rect x="184" width="82" height="48" rx="8" fill="#1e1b4b"/>
      <text x="192" y="18" fill="#34d399" font-size="9" font-family="system-ui">Disk</text>
      <text x="192" y="36" fill="#fff" font-size="16" font-weight="700" font-family="system-ui">45%</text>

      <rect x="276" width="82" height="48" rx="8" fill="#1e1b4b"/>
      <text x="284" y="18" fill="#60a5fa" font-size="9" font-family="system-ui">Network</text>
      <text x="284" y="36" fill="#fff" font-size="16" font-weight="700" font-family="system-ui">12 MB</text>
    </g>

    <!-- Mini chart -->
    <g transform="translate(12, 110)">
      <rect width="356" height="130" rx="8" fill="#1e1b4b"/>
      <text x="12" y="20" fill="#9ca3af" font-size="10" font-family="system-ui">System Load — 24h</text>

      <!-- Chart lines -->
      <polyline points="20,100 60,85 100,90 140,60 180,75 220,50 260,65 300,45 340,55" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <polyline points="20,105 60,95 100,100 140,80 180,88 220,70 260,78 300,60 340,68" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

      <!-- Chart area fill -->
      <polygon points="20,100 60,85 100,90 140,60 180,75 220,50 260,65 300,45 340,55 340,120 20,120" fill="#6366f1" opacity="0.08"/>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#312e81" stroke-width="2" opacity="0.3"/>
</svg>