<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="logo-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#logo-bg)"/>
  <!-- Inner shadow -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#fff" stroke-width="2" opacity="0.08"/>
  <!-- Monitor frame -->
  <rect x="116" y="108" width="280" height="196" rx="24" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="4" opacity="0.9"/>
  <!-- Screen area -->
  <rect x="132" y="124" width="248" height="164" rx="12" fill="#0f0a2e"/>
  <!-- Heartbeat / pulse line -->
  <polyline
    points="148,216 180,216 200,216 216,180 236,252 256,160 276,240 296,192 316,208 340,208 364,208"
    fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-glow)"/>
  <!-- Live dot -->
  <circle cx="364" cy="208" r="10" fill="#34d399"/>
  <circle cx="364" cy="208" r="16" fill="#34d399" opacity="0.25"/>
  <!-- Monitor stand -->
  <rect x="228" y="308" width="56" height="24" rx="4" fill="#1e1b4b"/>
  <rect x="200" y="332" width="112" height="16" rx="8" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2" opacity="0.6"/>
  <!-- Bottom metric dots -->
  <circle cx="196" cy="388" r="12" fill="#34d399" opacity="0.8"/>
  <circle cx="236" cy="388" r="12" fill="#a78bfa" opacity="0.8"/>
  <circle cx="276" cy="388" r="12" fill="#fbbf24" opacity="0.8"/>
  <circle cx="316" cy="388" r="12" fill="#60a5fa" opacity="0.8"/>
</svg>